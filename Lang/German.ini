subtitle_iso_win=Sie sollten originale (unbearbeitete) Windows-ISO-Dateien bevorzugen.
subtitle_iso_linux=⚠ Secure Boot wird nicht unterstützt. Secure Boot muss in den UEFI-Einstellungen für den Linux-Start deaktiviert sein. \n\n⚠ Einige Linux-Distributionen werden möglicherweise nicht unterstützt. \n\n⚠ Ubuntu 24.04+ und Ubuntu Server verwenden ein mehrschichtiges Squashfs-Dateisystem. Beim Booten muss die gesamte ISO in den RAM geladen werden. Der erforderliche Mindest-RAM beträgt etwa das Doppelte der ISO-Größe. \n\n⚠ Für Umgebungen mit wenig RAM werden Debian 12, Linux Mint oder Ubuntu 22.04 LTS empfohlen (eine einzelne Squashfs-Datei erfordert ca. 3–5 GB RAM).
