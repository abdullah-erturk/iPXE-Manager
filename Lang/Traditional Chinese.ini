subtitle_iso_linux=⚠ 不支援安全啟動 (Secure Boot)。若要開機 Linux，必須在 UEFI 設定中停用安全啟動。 \n\n⚠ 可能不支援某些 Linux 發行版。 \n\n⚠ Ubuntu 24.04 及更高版本以及 Ubuntu Server 採用分層 squashfs 系統。在啟動過程中，整個 ISO 鏡像必須載入到記憶體 (RAM)中。所需的最小記憶體約為 ISO 鏡像大小的兩倍。 \n\n⚠ 對於記憶體容量較低的環境，建議使用 Debian 12、Linux Mint 或 Ubuntu 22.04 LTS (單一 squashfs 檔案需要約 3–5 GB 記憶體)。
