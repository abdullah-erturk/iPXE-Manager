subtitle_iso_linux=⚠ Secure Boot desteklenmez. Linux önyüklemesi için UEFI ayarlarından Secure Boot devre dışı bırakılmalıdır. \n\n⚠ Bazı Linux sürümleri desteklenmeyebilir. \n\n⚠ Ubuntu 24.04+ ve Ubuntu Server, katmanlı squashfs sistemi kullanır. Boot sırasında ISO'nun tamamı RAM'e yüklenmek zorundadır. Gereken minimum RAM, ISO boyutunun yaklaşık 2 katına eşittir. \n\n⚠ Düşük RAM ortamları için Debian 12, Linux Mint veya Ubuntu 22.04 LTS önerilir (tek squashfs dosyası, ~3–5 GB RAM yeterli).
