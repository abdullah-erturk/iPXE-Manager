subtitle_iso_linux=⚠ Secure Boot is not supported. Secure Boot must be disabled in UEFI settings for Linux boot. \n\n⚠ Some Linux distributions may not be supported. \n\n⚠ Ubuntu 24.04+ and Ubuntu Server use a layered squashfs system. The entire ISO must be loaded into RAM during boot. The minimum RAM required is approximately twice the ISO size. \n\n⚠ For low RAM environments, Debian 12, Linux Mint, or Ubuntu 22.04 LTS are recommended (a single squashfs file requires ~3–5 GB of RAM).
