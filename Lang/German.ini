dhcp_desc=Verwenden Sie diesen Abschnitt, wenn Sie in Ihrer Umgebung einen externen DHCP-Server haben. \n(Gilt für Unternehmensnetzwerkumgebungen) \n\nSie können eine benutzerdefinierte iPXE-DHCP-Richtlinie (.bat) herunterladen und auf Ihrem Windows-DHCP-Server ausführen. Dadurch können Sie mit einem Klick eine iPXE-Serverrichtlinie für Ihren DHCP-Server erstellen und außerdem das automatische Booten von EFI/BIOS-Geräten ermöglichen.
